name: Observer BLE software validation

on:
  pull_request:
  push:
    branches: [main, master, feature/sensecap-p1-pro-ble-implementation]
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: read

concurrency:
  group: observer-ble-${{ github.ref }}
  cancel-in-progress: true

env:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
  MCTOMQTT_SKIP_NETWORK: '1'
  MCTOMQTT_SKIP_SYSTEM: '1'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned build tools
        run: |
          python -m pip install uv==0.11.18
          uv tool install --system-certs platformio==6.2.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Offline resolver and build guards
        run: >-
          uv run --project observer/meshcoretomqtt --system-certs --frozen --extra test
          python -m pytest -q tests/observer_build/
      - name: Native firmware and observer tests
        if: hashFiles('platformio.ini') != ''
        run: |
          pio test -e native -e native_kiss_modem -vv
          pio test -e native -f test_observer_transport -vv
      - name: Read-only public USB backup tools (synthetic PTY/GPG fixtures only)
        run: >-
          uv run --project observer/meshcoretomqtt --system-certs --frozen --extra test
          python -m pytest -q
          tests/hardware/test_p1pro_public_backup.py
          tests/hardware/test_p1pro_usb_common.py
      - name: Resolve latest official stable release into clean detached source
        run: |
          mkdir -p out
          python - <<'PY'
          import json, subprocess, sys
          from dataclasses import asdict
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from observer_build.release_resolver import resolve_official_latest_repeater_release
          pin = resolve_official_latest_repeater_release()
          Path('out/observer-resolved-release.json').write_text(json.dumps(asdict(pin), indent=2) + '\n')
          source = Path('out/observer-source')
          subprocess.run(['git', 'init', str(source)], check=True)
          subprocess.run(['git', '-C', str(source), 'fetch', '--depth=1', 'https://github.com/meshcore-dev/MeshCore.git', pin.commit_sha], check=True)
          subprocess.run(['git', '-C', str(source), 'checkout', '--detach', 'FETCH_HEAD'], check=True)
          PY
      - name: Prepare strict temporary firmware candidate and run exact-source native tests
        id: firmware_candidate
        continue-on-error: true
        env:
          TZ: UTC
        run: >-
          python tools/observer_build_candidate.py out/observer-source out/observer-candidate
          --patch-dir "$GITHUB_WORKSPACE/firmware/observer-lines544-release/observer-patch-v1.18.0"
          --release-json out/observer-resolved-release.json
          --build-date "$(date -u '+%d %b %Y')"
      - name: Offline host suite (no devices or brokers)
        if: steps.firmware_candidate.outcome == 'success'
        working-directory: observer/meshcoretomqtt
        env:
          OBSERVER_SOURCE: ${{ github.workspace }}/out/observer-source
        run: |
          uv sync --system-certs --frozen --extra test
          uv run --system-certs --frozen --extra test python -m pytest -q tests/
      - name: Archive unapproved firmware candidate or compatibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sensecap-observer-firmware-candidate-${{ github.run_id }}
          path: |
            out/observer-candidate/candidate-report.json
            out/observer-candidate/artifacts/observer.*
            out/observer-candidate/artifacts/provenance.json
            out/observer-resolved-release.json
          if-no-files-found: warn
          retention-days: 7
      - name: Resolve latest upstream bridge commit and fetch immutable checkouts
        run: |
          set -euo pipefail
          mkdir -p out
          bridge=https://github.com/Cisien/meshcoretomqtt.git
          git clone --quiet "$bridge" out/bridge-base
          git -C out/bridge-base fetch --quiet --depth=1 origin 9b4e022e298020ef3359b36d8c364931de058af5
          git -C out/bridge-base checkout --quiet --detach FETCH_HEAD
          git clone --quiet "$bridge" out/bridge-latest
          latest_sha=$(git -C out/bridge-latest rev-parse HEAD)
          [[ "$latest_sha" =~ ^[0-9a-f]{40}$ ]]
          git -C out/bridge-latest checkout --quiet --detach "$latest_sha"
          python - "$latest_sha" <<'PY'
          import json, sys
          from pathlib import Path
          Path('out/bridge-upstream-pin.json').write_text(json.dumps({
              'repository': 'Cisien/meshcoretomqtt',
              'baseline_sha': '9b4e022e298020ef3359b36d8c364931de058af5',
              'candidate_sha': sys.argv[1],
          }, indent=2) + '\n')
          PY
      - name: Rebase scoped observer bridge overlay and run upstream offline suite
        id: bridge_candidate
        continue-on-error: true
        run: >-
          python tools/observer_bridge_candidate.py
          --base-repo out/bridge-base --latest-repo out/bridge-latest
          --output out/bridge-candidate --run-tests
          --firmware-source out/observer-source
      - name: Archive upstream bridge overlay and test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meshcoretomqtt-observer-overlay-${{ github.run_id }}
          path: |
            out/bridge-candidate/observer-bridge-overlay.patch
            out/bridge-candidate/bridge-candidate-report.json
            out/bridge-candidate/latest-bridge-commit.txt
            out/bridge-upstream-pin.json
          if-no-files-found: warn
          retention-days: 7
      - name: Fail visibly when either upstream candidate fails
        if: steps.firmware_candidate.outcome == 'failure' || steps.bridge_candidate.outcome == 'failure'
        run: exit 1
